name: hospitalos
services:
  db:
    image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    restart: unless-stopped
    ports:
      - '127.0.0.1:5432:5432' # localhost only, never exposed to the network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: hms_dev
    volumes:
      - hms_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d hms_dev']
      interval: 5s
      timeout: 3s
      retries: 10
  # Media server for video meetings (optional; see README "Video meetings"). Reachable from
  # this machine only by default; set LIVEKIT_BIND and LIVEKIT_NODE_IP to your LAN address to
  # call from other computers on the same network.
  livekit:
    image: livekit/livekit-server:v1.13.9@sha256:d0c04791bf63ca8dcea123571827d56ba9504bd57c8d5de60ee03b5408cc3154
    restart: unless-stopped
    command: ['--config', '/etc/livekit.yaml', '--node-ip', '${LIVEKIT_NODE_IP:-127.0.0.1}']
    ports:
      - '${LIVEKIT_BIND:-127.0.0.1}:7880:7880'
      - '${LIVEKIT_BIND:-127.0.0.1}:7881:7881'
      - '${LIVEKIT_BIND:-127.0.0.1}:7882:7882/udp'
    environment:
      # Empty unless .env sets both; the server then refuses to start, which video:up reports.
      LIVEKIT_KEYS: '${LIVEKIT_API_KEY:-}: ${LIVEKIT_API_SECRET:-}'
    volumes:
      - ./docker/livekit/livekit.yaml:/etc/livekit.yaml:ro
    profiles: ['video']
  # Local email catcher for password-reset links (development only): every email the API
  # sends lands in the inbox at http://127.0.0.1:8025 instead of being delivered.
  mailpit:
    image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    restart: unless-stopped
    ports:
      - '127.0.0.1:1025:1025' # SMTP
      - '127.0.0.1:8025:8025' # inbox in the browser
    profiles: ['mail']
volumes:
  hms_pgdata:
